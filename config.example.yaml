# 配置标记：
# - [必须修改] 首次启动前必须替换，否则服务会拒绝启动或存在安全风险。
# - [按需修改] 仅在部署方式发生变化时调整。
# - [通常不要修改] 已采用推荐默认值。
#
# 运行时设置优先级：管理后台保存过「设置」后，可编辑字段会持久化到
# 数据库（runtime_settings 表），此后每次启动以数据库为准——直接改
# 本文件中这些字段并重启不会生效。首次部署（未在后台保存过设置）时
# 本文件即为生效值。恢复文件基线请使用管理端相应配置域的重置操作：
# 重置会保留并推进持久版本，供并发编辑和其他实例正确识别。

server:
  # [运行时管理] 最大并发请求门禁（1-100000）也可在管理后台「设置-服务」修改；此处仅启动默认。
  maxConcurrentRequests: 1024
  # [通常不要修改] Docker 镜像会通过启动参数覆盖为 0.0.0.0:8000。
  listen: "127.0.0.1:8000"
  # [通常不要修改] 单次请求体上限 32 MiB。
  maxBodyBytes: 33554432
  # [按需修改] 仅列出会覆盖 X-Forwarded-For / X-Real-IP 的可信反向代理。
  # 留空时忽略所有转发头并记录直连对端 IP；不要使用 0.0.0.0/0 或 ::/0。
  # Docker/Nginx 示例：["127.0.0.1", "172.16.0.0/12"]
  trustedProxies: []
  # [通常不要修改] 仅限制客户端上传完整请求体的时间，不限制推理或流式响应。
  readTimeout: 15m
  # [通常不要修改] 管理 API 和非流式请求的最长生命周期。
  requestTimeout: 2h
  # [按需修改] 仅在本地或受信任环境开启，生产环境保持 false。
  swaggerEnabled: false
  # [按需修改] 启动与每 24h 出网访问 api.github.com 检查新版本（User-Agent 不含版本号）。
  # 内网/离线/合规敏感部署设为 false 关闭；留空（不配置）默认开启。
  # updateCheckEnabled: true

auth:
  # [通常不要修改] 管理端访问与刷新令牌有效期。
  accessTokenTTL: 15m
  refreshTokenTTL: 720h
  # [按需修改] 外部地址使用 HTTPS 时必须设为 true。
  secureCookies: false

secrets:
  # [必须修改] 至少 32 个字符。快速生成：openssl rand -hex 32
  jwtSecret: "replace-with-at-least-32-characters"
  # [必须修改] Base64 编码的 32 字节密钥。快速生成：openssl rand -base64 32
  # 轮换流程：1) 生成新密钥填入本字段；2) 把旧密钥放入下方
  # legacyCredentialEncryptionKeys；3) 重启——存量凭据经历史密钥回退
  # 继续可解，新写入一律用新主密钥。不轮换则删除该列表。
  credentialEncryptionKey: "replace-with-base64-key"
  # [按需修改：仅轮换时] 历史密钥列表（按轮换先后排列）。
  # legacyCredentialEncryptionKeys:
  #   - "旧的-base64-32字节密钥="

bootstrapAdmin:
  # [按需修改] 仅在数据库中没有管理员时使用。
  username: "admin"
  # [必须修改] 首次启动前替换为强密码；管理员创建成功后建议删除本段。
  password: "replace-with-a-strong-password"

frontend:
  # [通常不要修改] Go 服务同源托管的前端构建目录。
  staticPath: "./frontend/dist"
  # [按需修改] 对外可达的 API 基址，用于拼装图片/视频等媒体资源的下载
  # url。默认 http://127.0.0.1:8000——端口映射（如宿主 38000→容器 8000）
  # 或反代部署必须显式设置，否则媒体 url 指向容器内地址，客户端不可达
  # （实测：设为 http://宿主:38000 后生成→下载全链 200）。
  # 也可在管理端设置面热修改（即时生效）。留空使用默认值。
  # publicApiBaseURL: "http://127.0.0.1:8000"

# 前端运行时覆盖钩子（分离部署用）：镜像内 /app/frontend/dist/
# runtime-config.js 默认空对象（同源调用 API）。前端与 API 分属不同
# 域名时，将其挂载覆盖为：
#   window.__GROK2API_RUNTIME_CONFIG__ = {
#     apiBaseUrl: "https://api.example.com",      // 管理端 API 基址
#     publicApiBaseUrl: "https://cdn.example.com" // 媒体资源基址（可省略）
#   };
# 同源部署无需任何改动。

database:
  # [按需修改] 单实例使用 sqlite；多实例改为 postgres。
  driver: sqlite # sqlite | postgres
  sqlite:
    # [通常不要修改] 相对路径以本配置文件所在目录为基准。
    path: "./data/backend.db"
  postgres:
    # [必须修改：仅 driver=postgres] 填写真实 DSN，并按需启用 sslmode。
    # 也可通过 GROK2API_DATABASE_URL 注入；非空环境变量会覆盖本字段并自动启用 postgres。
    dsn: "postgres://user:password@127.0.0.1:5432/grok2api?sslmode=disable"
    # [按需修改] 根据数据库连接容量调整。
    maxOpenConns: 50
    maxIdleConns: 10

runtimeStore:
  # [按需修改] 单实例使用 memory；多实例改为 redis。
  driver: memory # memory | redis
  redis:
    # [必须修改：仅 driver=redis] 填写 Redis 连接信息。
    address: "127.0.0.1:6379"
    username: ""
    password: ""
    database: 0
    # [通常不要修改] 同一 Redis 中部署多个实例组时才需要更换。
    keyPrefix: "grok2api:"
    # [按需修改] Redis 使用 TLS 时设为 true。
    tls: false

deployment:
  # [通常不要修改] 单实例保持 1；多实例必须同时使用 PostgreSQL、Redis 和共享媒体目录。
  replicas: 1
  # [必须修改：仅 replicas>1] 每个实例使用不同的稳定标识。
  instanceID: ""
  # [必须修改：仅 replicas>1] 同一实例组和共享媒体目录必须使用相同标识。
  clusterID: "grok2api"
  # [必须修改：仅 replicas>1] 确认 media.local.path 已挂载为所有实例共享且可读写的存储。
  sharedMedia: false

# 上游 Provider 端点与指纹。留空（整段省略）使用下方内置默认值；仅在做
# 反代/自托管/出口改造时按需覆盖，普通部署不需要本段。
provider:
  build:
    # [按需修改] Grok Build(CLI) 上游地址。
    baseURL: "https://cli-chat-proxy.grok.com/v1"
    # [按需修改] 上游 4xx/5xx 不可用时的回退地址（Build API 直连）。
    fallbackBaseURL: "https://api.x.ai/v1"
    # [通常不要修改] 客户端指纹三元组：版本/标识/TokenAuth 头。与真实
    # grok-cli 发行版保持一致，随意改动可能触发上游风控。
    clientVersion: "1.0.4"
    clientIdentifier: "grok-shell"
    tokenAuth: "xai-grok-cli"
    # [通常不要修改] 请求 User-Agent，默认随 clientVersion 派生。
    userAgent: "grok-shell/1.0.4 (linux; x86_64)"
  web:
    # [按需修改] Grok Web(SSO Cookie) 上游地址。
    baseURL: "https://grok.com"
    # [通常不要修改] 各类上游调用的超时：配额查询/对话/图片/视频。
    quotaTimeout: 25s
    chatTimeout: 2m
    imageTimeout: 3m
    videoTimeout: 15m
    # [通常不要修改] 媒体任务并发上限。
    mediaConcurrency: 4
    # [按需修改] 是否允许通过管理端为 Web 账号开启 NSFW 开关。
    allowNSFW: false
    # [通常不要修改] 配额恢复探测的退避基准与上限。
    recoveryBackoffBase: 30s
    recoveryBackoffMax: 30m
  console:
    # [按需修改] Grok Console 上游地址。
    baseURL: "https://console.x.ai"
    # [通常不要修改] Console 对话超时。
    chatTimeout: 5m

media:
  # [通常不要修改] 当前仅支持 local；容量和清理策略在管理端设置。
  driver: local
  local:
    # [按需修改] 图片二进制目录；数据库只保存资源元数据。
    path: "./data/media"

routing:
  # [按需修改] 以下调度参数同样可在管理后台「设置-路由」运行时修改；文件值仅作启动默认。
  # 会话粘性 TTL（0 关闭粘性）与冷启动/失败冷却的基准、上限及容量等待窗口。
  stickyTTL: 1h
  cooldownBase: 30s
  cooldownMax: 30m
  capacityWait: 500ms
  # 单请求账号切换上限（含降智换号重试）与视频任务上限；0 用内置默认。
  maxAttempts: 999
  videoMaxAttempts: 999
  # [按需启用] 优先调度 Free 池；以及 Build chat denied(403) 是否标记账号需重新授权。
  preferFreeBuild: false
  markBuildChatDeniedAsReauth: false
  # [按需修改] 服务端推理回放缓存：多轮时自动补回客户端未携带的 encrypted_content。
  reasoningReplayEnabled: true
  reasoningReplayTTL: 1h
  reasoningReplayMaxEntries: 10240
  # 持久历史独立于内存/Redis TTL；超出容量明确拒绝新增，不截断旧前缀。
  # 以下两项修改后重启生效。
  conversationHistoryRetention: 24h
  conversationHistoryMaxBytes: 67108864
  # [按需修改] 按账号隔离上游连接池，适合外部 L4/连接哈希负载均衡；会增加连接数、TLS 握手和文件描述符占用。
  accountIsolatedConnections: false
  # [通常不要修改] 大账号池默认使用有界分段选号；保留完整池回退、额度优先级和原子并发门禁。
  segmentedSelectorEnabled: true
  segmentedSelectorMinCandidates: 3000
  segmentedSelectorWindowSize: 64

audit:
  # [按部署修改] 持久待写账本目录；相对配置文件解析，必须位于持久本地磁盘。
  # 同 clusterID/instanceID 沿原目录恢复；每实例独占文件。不能放在网络文件系统。
  journalDirectory: ./data/audit
  # [按需修改] 已接受载荷的字节上限（含待修复记录），不含 SQLite 索引/WAL 开销。
  journalMaxBytes: 536870912
  # [通常不要修改] bufferSize 限制待写条数（含正在提交和待修复记录）。
  # journalDirectory、journalMaxBytes、bufferSize 的修改均需重启；容量不足不会淘汰旧记录。
  bufferSize: 16384
  batchSize: 256
  flushInterval: 250ms
  # [通常不要修改] 需要调用方确认提交的审计最多聚合等待该时长；建议保持 1ms–50ms。
  commitDelay: 5ms
  # [按需修改] 唯一审计保留时长；0 永久，非零 24h–8760h，默认 168h（7 天）。
  # 管理端可在线修改，下一批清理读取最新持久值；每批 500 条、每轮最多 30s。
  # 升级旧文件时先合并 retention/retentionDays，不可与此字段混写。
  retentionPeriod: 168h
  # [通常不要修改] enforce 在持续 SQL 故障或条数/字节容量压力超过宽限期后暂停新推理。
  # observe 允许可恢复的积压；未接收事实或持久隔离的坏记录在两种模式下均阻断。
  # 重启沿原文件补交记录；坏记录启动时重试一次，仍失败则保留等待修复，不会自动丢弃。
  ledgerMode: enforce # observe | enforce
  ledgerFailureThreshold: 1
  ledgerUnhealthyGrace: 10s
  ledgerQueueHighWatermarkPercent: 90

# 实时守卫启动基线。首次装配后由管理端 quality_guard 版本化配置维护；
# 每个请求固定策略快照，修改本文件需要重启，管理端保存热更新后续请求。
requestRetry:
  # 实时质量守卫（零延迟流式状态机）：思考增量瞬时放行；推理阶段闭合
  # （output_item.done 携 reasoning item / thinking 块 stop）却零思考增量
  # 或正文抢跑时 0ms 扣留换号重试；预算耗尽 Fail-Closed 503。
  enabled: true
  # 首次启动清单为空时沿用默认 grok-4.5/grok-4.6 清单。
  # 管辖按公开模型名精确匹配；管理端保存启用状态必须勾选至少一个模型。
  guardedModels: [] # 例: ["grok-4.5", "grok-4.6"]
  # 文件与管理共用 1–100 次质量尝试范围；默认首次 + 1 次重试。
  # 请求还受全局尝试预算和总准入截止限制。
  maxAttempts: 2
  # 流式零证据截止：从首个 SSE data 事件起计时，后续元数据不续期。
  # 此前只使用首事件预算；两个阶段均受总准入期限约束，超时不是降智证据。
  # 0 = 默认 3.5s；非零须为正数且不超过 24h。仅作用流式（非流式读完整 body 后判决：
  # Responses 原生形状与转换后的 chat/messages 客户端形状共用同一证据语义）。
  evidenceTimeout: 3.5s
  # 流式首事件截止：首个 SSE data 事件到达前的等待上限。
  # 0 = 默认 5s；非零须为正数且不超过 24h。总准入截止仍有效。
  createdTimeout: 5s
  # 总准入期限，覆盖等待与质量重试；0 使用下面的默认值，非零须在 (0,24h]。
  admissionTimeout: 30s
  toolAdmissionTimeout: 3m
  onExhausted: fail_closed # 旧 fail_open 仍可读取，但有效政策始终为 fail_closed
  # 临时质量限制默认 2 分钟，以事件为 owner；后续案件限制独立持有。
  # 质量判定不修改账号人工 enabled 状态，也不累计禁用 strike。
  accountCooldown: 2m
  # 空流/静默超时的可用性冷却，与质量事件的 owner 限制独立。
  # 文件中 0 = 默认 15m；两类冷却非零均须为正数且不超过 168h。
  idleAccountCooldown: 15m

# 新建客户端 Key 的默认限流值（管理端创建界面仍可逐 Key 覆盖）。
clientKeyDefaults:
  # [按需修改] 每分钟请求数默认值（1-100000）。
  rpmLimit: 120
  # [按需修改] 并发请求数默认值（1-1024）。
  maxConcurrent: 8

# 出口自动换 IP（webhook 轮换）。质量侧的隔离/解禁判定已由新质量层
# （仲裁庭/执行所）承接:IP 变化解禁与人工解禁入口见「质量防护」页;
# 此处只保留轮换执行的机械参数。
egress:
  # 每进程网络预算；变更后重启生效，零值采用下列默认值。
  # 建立中、活跃、空闲与已从缓存淘汰但尚未关闭的 socket 都计入额度。
  runtime:
    maxConnections: 512
    maxDialing: 32
    maxRequests: 2048
    maxWaiters: 512
    maxClients: 2048
    queueTimeout: 2s
  rotation:
    enabled: true
    # 单次隔离周期内每节点最多换 IP 尝试次数（耗尽后保持隔离并告警）。
    maxAttemptsPerQuarantine: 3
    # 同一节点两次换 IP 的最小间隔。
    minNodeInterval: 3m
    # 全局每小时换 IP 次数上限（所有节点合计）。
    maxGlobalPerHour: 6
    webhookTimeout: 15s
    webhookRetries: 2
    # 触发 webhook 后等待隧道重建的静默期。
    settleDelay: 20s
    # 轮换后连通探活的窗口与间隔。
    probeTimeout: 2m
    probeInterval: 5s
