# 配置标记：
# - [必须修改] 首次启动前必须替换，否则服务会拒绝启动或存在安全风险。
# - [按需修改] 仅在部署方式发生变化时调整。
# - [通常不要修改] 已采用推荐默认值。
#
# 运行时设置优先级：管理后台保存过「设置」后，可编辑字段会持久化到
# 数据库（runtime_settings 表），此后每次启动以数据库为准——直接改
# 本文件中这些字段并重启不会生效。首次部署（未在后台保存过设置）时
# 本文件即为生效值。要把控制权还给本文件：先在后台把值改回期望值，
# 或备份后删除数据库中的 runtime_settings 行再重启。

server:
  # [运行时管理] 最大并发请求门禁（1-100000）也可在管理后台「设置-服务」修改；此处仅启动默认。
  maxConcurrentRequests: 1024
  # [通常不要修改] Docker 镜像会通过启动参数覆盖为 0.0.0.0:8000。
  listen: "127.0.0.1:8000"
  # [通常不要修改] 单次请求体上限 32 MiB。
  maxBodyBytes: 33554432
  # [按需修改] 仅列出会覆盖 X-Forwarded-For / X-Real-IP 的可信反向代理。
  # 留空时忽略所有转发头并记录直连对端 IP；不要使用 0.0.0.0/0 或 ::/0。
  # Docker/Nginx 示例：["127.0.0.1", "172.16.0.0/12"]
  trustedProxies: []
  # [通常不要修改] 仅限制客户端上传完整请求体的时间，不限制推理或流式响应。
  readTimeout: 15m
  # [通常不要修改] 管理 API 和非流式请求的最长生命周期。
  requestTimeout: 2h
  # [按需修改] 仅在本地或受信任环境开启，生产环境保持 false。
  swaggerEnabled: false
  # [按需修改] 启动与每 24h 出网访问 api.github.com 检查新版本（User-Agent 不含版本号）。
  # 内网/离线/合规敏感部署设为 false 关闭；留空（不配置）默认开启。
  # updateCheckEnabled: true

auth:
  # [通常不要修改] 管理端访问与刷新令牌有效期。
  accessTokenTTL: 15m
  refreshTokenTTL: 720h
  # [按需修改] 外部地址使用 HTTPS 时必须设为 true。
  secureCookies: false

secrets:
  # [必须修改] 至少 32 个字符。快速生成：openssl rand -hex 32
  jwtSecret: "replace-with-at-least-32-characters"
  # [必须修改] Base64 编码的 32 字节密钥。快速生成：openssl rand -base64 32
  # 轮换流程：1) 生成新密钥填入本字段；2) 把旧密钥放入下方
  # legacyCredentialEncryptionKeys；3) 重启——存量凭据经历史密钥回退
  # 继续可解，新写入一律用新主密钥。不轮换则删除该列表。
  credentialEncryptionKey: "replace-with-base64-key"
  # [按需修改：仅轮换时] 历史密钥列表（按轮换先后排列）。
  # legacyCredentialEncryptionKeys:
  #   - "旧的-base64-32字节密钥="

bootstrapAdmin:
  # [按需修改] 仅在数据库中没有管理员时使用。
  username: "admin"
  # [必须修改] 首次启动前替换为强密码；管理员创建成功后建议删除本段。
  password: "replace-with-a-strong-password"

frontend:
  # [通常不要修改] Go 服务同源托管的前端构建目录。
  staticPath: "./frontend/dist"
  # [按需修改] 对外可达的 API 基址，用于拼装图片/视频等媒体资源的下载
  # url。默认 http://127.0.0.1:8000——端口映射（如宿主 38000→容器 8000）
  # 或反代部署必须显式设置，否则媒体 url 指向容器内地址，客户端不可达
  # （2026-08-21 实测：设为 http://宿主:38000 后生成→下载全链 200）。
  # 也可在管理端设置面热修改（即时生效）。留空使用默认值。
  # publicApiBaseURL: "http://127.0.0.1:8000"

# 前端运行时覆盖钩子（分离部署用）：镜像内 /app/frontend/dist/
# runtime-config.js 默认空对象（同源调用 API）。前端与 API 分属不同
# 域名时，将其挂载覆盖为：
#   window.__GROK2API_RUNTIME_CONFIG__ = {
#     apiBaseUrl: "https://api.example.com",      // 管理端 API 基址
#     publicApiBaseUrl: "https://cdn.example.com" // 媒体资源基址（可省略）
#   };
# 同源部署无需任何改动。

database:
  # [按需修改] 单实例使用 sqlite；多实例改为 postgres。
  driver: sqlite # sqlite | postgres
  sqlite:
    # [通常不要修改] 相对路径以本配置文件所在目录为基准。
    path: "./data/backend.db"
  postgres:
    # [必须修改：仅 driver=postgres] 填写真实 DSN，并按需启用 sslmode。
    # 也可通过 GROK2API_DATABASE_URL 注入；非空环境变量会覆盖本字段并自动启用 postgres。
    dsn: "postgres://user:password@127.0.0.1:5432/grok2api?sslmode=disable"
    # [按需修改] 根据数据库连接容量调整。
    maxOpenConns: 50
    maxIdleConns: 10

runtimeStore:
  # [按需修改] 单实例使用 memory；多实例改为 redis。
  driver: memory # memory | redis
  redis:
    # [必须修改：仅 driver=redis] 填写 Redis 连接信息。
    address: "127.0.0.1:6379"
    username: ""
    password: ""
    database: 0
    # [通常不要修改] 同一 Redis 中部署多个实例组时才需要更换。
    keyPrefix: "grok2api:"
    # [按需修改] Redis 使用 TLS 时设为 true。
    tls: false

deployment:
  # [通常不要修改] 单实例保持 1；多实例必须同时使用 PostgreSQL、Redis 和共享媒体目录。
  replicas: 1
  # [必须修改：仅 replicas>1] 每个实例使用不同的稳定标识。
  instanceID: ""
  # [必须修改：仅 replicas>1] 同一实例组和共享媒体目录必须使用相同标识。
  clusterID: "grok2api"
  # [必须修改：仅 replicas>1] 确认 media.local.path 已挂载为所有实例共享且可读写的存储。
  sharedMedia: false

# 上游 Provider 端点与指纹。留空（整段省略）使用下方内置默认值；仅在做
# 反代/自托管/出口改造时按需覆盖，普通部署不需要本段。
provider:
  build:
    # [按需修改] Grok Build(CLI) 上游地址。
    baseURL: "https://cli-chat-proxy.grok.com/v1"
    # [按需修改] 上游 4xx/5xx 不可用时的回退地址（Build API 直连）。
    fallbackBaseURL: "https://api.x.ai/v1"
    # [通常不要修改] 客户端指纹三元组：版本/标识/TokenAuth 头。与真实
    # grok-cli 发行版保持一致，随意改动可能触发上游风控。
    clientVersion: "1.0.4"
    clientIdentifier: "grok-shell"
    tokenAuth: "xai-grok-cli"
    # [通常不要修改] 请求 User-Agent，默认随 clientVersion 派生。
    userAgent: "grok-shell/1.0.4 (linux; x86_64)"
  web:
    # [按需修改] Grok Web(SSO Cookie) 上游地址。
    baseURL: "https://grok.com"
    # [通常不要修改] 各类上游调用的超时：配额查询/对话/图片/视频。
    quotaTimeout: 25s
    chatTimeout: 2m
    imageTimeout: 3m
    videoTimeout: 15m
    # [通常不要修改] 媒体任务并发上限。
    mediaConcurrency: 4
    # [按需修改] 是否允许通过管理端为 Web 账号开启 NSFW 开关。
    allowNSFW: false
    # [通常不要修改] 配额恢复探测的退避基准与上限。
    recoveryBackoffBase: 30s
    recoveryBackoffMax: 30m
  console:
    # [按需修改] Grok Console 上游地址。
    baseURL: "https://console.x.ai"
    # [通常不要修改] Console 对话超时。
    chatTimeout: 5m

media:
  # [通常不要修改] 当前仅支持 local；容量和清理策略在管理端设置。
  driver: local
  local:
    # [按需修改] 图片二进制目录；数据库只保存资源元数据。
    path: "./data/media"

routing:
  # [按需修改] 以下调度参数同样可在管理后台「设置-路由」运行时修改；文件值仅作启动默认。
  # 会话粘性 TTL（0 关闭粘性）与冷启动/失败冷却的基准、上限及容量等待窗口。
  stickyTTL: 1h
  cooldownBase: 30s
  cooldownMax: 30m
  capacityWait: 500ms
  # 单请求账号切换上限（含降智换号重试）与视频任务上限；0 用内置默认。
  maxAttempts: 999
  videoMaxAttempts: 999
  # [按需启用] 优先调度 Free 池；以及 Build chat denied(403) 是否标记账号需重新授权。
  preferFreeBuild: false
  markBuildChatDeniedAsReauth: false
  # [按需修改] 服务端推理回放缓存：多轮时自动补回客户端未携带的 encrypted_content。
  reasoningReplayEnabled: true
  reasoningReplayTTL: 1h
  reasoningReplayMaxEntries: 10240
  # [按需修改] 按账号隔离上游连接池，适合外部 L4/连接哈希负载均衡；会增加连接数、TLS 握手和文件描述符占用。
  accountIsolatedConnections: false
  # [通常不要修改] 大账号池默认使用有界分段选号；保留完整池回退、额度优先级和原子并发门禁。
  segmentedSelectorEnabled: true
  segmentedSelectorMinCandidates: 3000
  segmentedSelectorWindowSize: 64

audit:
  # [通常不要修改] 审计批量写入参数；bufferSize 的修改需重启生效。
  bufferSize: 16384
  batchSize: 256
  flushInterval: 250ms
  # [通常不要修改] 需要调用方确认提交的审计最多聚合等待该时长；建议保持 1ms–50ms。
  commitDelay: 5ms
  # [按需修改] 自动清理超过该天数的请求审计与尝试诊断；0 表示永久保留。
  # 注意与下方 retention 同时生效时，实际保留窗口取两者更短者；
  # 该值属于运行时设置面（管理端可改，无需重启）。
  retentionDays: 7
  # [通常不要修改] enforce 会在异常持续超过宽限期后暂停新的推理请求；
  # 确认发生数据丢失（队列溢出丢行）时立即暂停，且该状态不可自愈——
  # 恢复推理需重启进程（设计语义：宁可拒绝服务也不静默丢账）。observe
  # 只记日志不拦截。该开关对所有推理入口生效（文本/图像/视频/语音）。
  ledgerMode: enforce # observe | enforce
  ledgerFailureThreshold: 1
  ledgerUnhealthyGrace: 10s
  ledgerQueueHighWatermarkPercent: 90
  # 审计保留时长：超过该时长的 request_audits 及 attempts 明细由后台任务
  # 每小时分批删除（每批 500 条，单轮 30s 预算）。0 = 永久保留（默认）；
  # 非零须在 24h-8760h 之间；修改需重启进程。与 retentionDays 相互独立、
  # 同时启用时实际保留窗口取两者更短者。
  retention: 0

# 实时路由守卫（requestRetry）：进程内请求级降智拦截，在请求路径上完成
# 检测与重试（推理证据判定 + 同号重试 + 换号 + RSC 归因），
# 不依赖主动探测或被动 TPS 统计；修改后需重启进程生效（本段不在
# 管理端运行时设置面内，配置热加载总线不会重读本文件——2026-08-21
# 实测：yaml 翻转 enabled 后未重启守卫行为不变，重启后生效）。
requestRetry:
  # 生产推荐开启：30s hold 等待流末加密思考（grok-4.6 实测），降智路径
  # 由 earlyHeaderAbort 在响应头阶段提前拦截，二者互补。
  enabled: true
  maxAttempts: 6
  holdTimeout: 3s
  # 流式零证据截止：静默期超过该时长仍无思考证据且无任何可见输出时，
  # 中止该次上游尝试并按空闲路径重试。复杂提示词的降智流首输出静默期
  # 实测 75-121s（总客户端死寂可达 ~10min），而干净流首个思考增量 2.1s
  # 即达（含复杂提示词）——15s 截止有 7 倍安全边际，把降智流式尝试压到
  # 预算内。0 = 默认 15s；非零须在 3s-5m。仅作用流式（非流式响应头等
  # 整个生成完成，无中期信号，由完整 body 判决覆盖）。
  evidenceTimeout: 15s
  # 流式首事件截止：连任何 SSE data 事件（response.created/首 chunk）都
  # 未到达即中止该次尝试并重试。直连复测（绕过网关）：clean 首事件恒定
  # 0.8-2.2s（与提示词复杂度无关），降智排队期间零 data 事件达 68-125s
  # （仅 keepalive 注释）。0 = 默认 5s；非零须在 1s-2m。
  createdTimeout: 5s
  # 中途突发内容达到该阈值可提前扣留（无需等流结束）；推理模型对任何
  # 长度的回答都会思考，终态无推理一律扣留，与该阈值无关。
  minOutputTokens: 8
  onExhausted: fail_closed # fail_open | fail_closed
  # [实验] 响应头预算早断（0=关闭）：实测健康推理路径的响应头恒定秒级返回
  # （与生成长度无关），降智路径连头都要等整个生成完成（复杂问题 30s+）。
  # 头超过该预算未返回即中止换路径重试，把降智判定提前到头阶段；预算对
  # 每次流式尝试持续生效（单发解除机制已移除）。建议 10s（健康路径实测
  # ≤3s 含隧道开销；5s 以下冷连接偶发慢头会造成误伤）。触发本身只做
  # 软冷却+归因；即使 RSC 判账号清白，也需 crossAccountWindow 内第二个
  # 不同账号（或同账号再犯）确认后才 24h 隔离——单次头迟滞不直接定罪。
  earlyHeaderAbort: 0s
  # 首次扣留时先重试当前账号一次（配额探测通道账号除外）：隧道池出口按
  # 请求轮换，同号重试即隐式换 IP，可区分瞬时出口污染与降智账号；
  # 重试仍扣留才进入换号重试与账号惩罚。注意探测（probe）通道来源的
  # 账号永不参与同号重试（见 selector 会话 probeCandidates 语义）。
  sameAccountRetry: true
  # First missing-thinking hit cools the account; a later hit after the
  # cooldown expires disables it. 0 disables account cooldown; nonzero
  # must be 1m-168h.
  accountCooldown: 12h
  # 空流/静默超时（0 token 或 2min 无数据）的账号冷却，独立于上面的
  # missing-thinking 冷却（空流常与出口 IP 相关而非账号本身，冷却时长
  # 可独立调整）。0 = 默认 15m；非零须在 1m-168h。冷却中的账号可在
  # 管理页「冷却」徽标上一键解除（人工逃生门）。空流多与出口 IP/瞬态
  # 相关（RSC clean 自动解除），默认短冷却即可。
  idleAccountCooldown: 15m

# [按需启用] 账号级 RSC 风险归因：质量扣留触发异步 RSC 检查（经关联的
# Web SSO）。clean 账号免于惩罚（出口 IP 嫌疑）；risk 结论永不恢复并
# 永久缓存，规模安全。本段已进管理后台「守卫」页，保存后立即生效；
# 直接改文件仍需重启，且后台保存过设置后以运行时设置为准（可在后台
# 「恢复文件默认」清除运行时覆盖）。
accountRisk:
  rscCheck:
    enabled: false
    # 检测方式：ssoProbe（默认）= 用 SSO Cookie 向 grok.com 发起一次临时
    # fast 会话（不落会话、不写记忆），首个流里有 notetaker/thinking 通道
    # => 账号健康(clean)；答案文本直接到达且全程无 thinking => 已被风控
    # (denied)。限流/挑战/断流等异常一律按 error 处理，绝不误判为风控。
    # 注意：每次检查消耗该账号 1 条消息额度（basic 档约 30 条/24h），
    # 归因由降智事件触发且并发受限，量级可控。
    # grok.com 已停止在首页 RSC 载荷中下发 botFlag 字段，homepage 旧方式
    # 已失效，仅保留作回滚。
    method: ssoProbe
    concurrency: 2        # RSC 检查全局并发上限（1-8）
    timeout: 30s          # 单次检查超时（5s-60s）
    # denied 处置（按通道隔离，只作用于实际降智的账号，不级联身份组）：
    # flag = 打风控标记（账号保持启用、调度永久跳过、UI 徽章，可人工解除，
    # 推荐）；disable = 直接停用该账号；markOnly = 仅记日志。
    onDenied: flag
    # Build 自主探测兜底（默认关闭）：未关联 Web SSO 的 Build 账号降智时，
    # 用其自身凭据发一次微型推理请求差分判定（有关联时始终优先 SSO 探针）。
    buildProbe:
      enabled: false
    patrol:
      enabled: false      # clean 账号低频巡检（每 15 分钟一批 50 个）
      bucketDays: 30      # clean 结论的有效期（7-90 天）

# 新建客户端 Key 的默认限流值（管理端创建界面仍可逐 Key 覆盖）。
clientKeyDefaults:
  # [按需修改] 每分钟请求数默认值（1-100000）。
  rpmLimit: 120
  # [按需修改] 并发请求数默认值（1-1024）。
  maxConcurrent: 8

# 出口 IP 质量守卫与自动换 IP（应对"IP 被标记后路由到降智模型"）。
# 触发链：请求降智 → 账号 RSC 归因 CLEAN → 该出口节点隔离（后续请求由路由层自动落到其他可用出口）
# → POST 节点的换 IP webhook（如重启 MicroWARP）→ 探活 + 校验出口 IP 已变化
# → 一次性 canary 验证（极小推理请求，首事件延迟判定）→ 通过回池 / 失败再换。
egress:
  qualityGuard:
    # 隔离时长：坏出口在轮换+验证完成前不参与调度（验证通过会提前解除）。
    quarantineCooldown: 24h
    # 跨账号确认兜底：RSC 归因关闭/未链接/进行中时，同一节点在窗口内有
    # N 个不同账号降智即隔离（账号去重）。<2 关闭该兜底。
    crossAccountThreshold: 2
    crossAccountWindow: 30m
    # canary 无法执行（未配置模型/无可用账号）时的暂定放行冷却：
    # 降智证据软冷却(L2):证据出现即让全池账号避开该出口,不等 RSC 归因;
    # 重复证据指数翻倍,封顶 softCooldownMax。RSC 判 RISK(账号有罪)时立即解除。
    softCooldownBase: 5m
    softCooldownMax: 1h
    # 回池但保留短冷却，被动守卫兜底。
    tentativeReleaseCooldown: 30m
  rotation:
    enabled: true
    # 单次隔离周期内每节点最多换 IP 尝试次数（耗尽后保持隔离并告警）。
    maxAttemptsPerQuarantine: 3
    # 同一节点两次换 IP 的最小间隔。
    minNodeInterval: 3m
    # 全局每小时换 IP 次数上限（所有节点合计）。
    maxGlobalPerHour: 6
    webhookTimeout: 15s
    webhookRetries: 2
    # 触发 webhook 后等待隧道重建的静默期。
    settleDelay: 20s
    # 轮换后连通探活的窗口与间隔。
    probeTimeout: 2m
    probeInterval: 5s
    # canary 验证用的模型 public ID（在「模型路由」里查）。留空 = 关闭
    # 主动验证（换 IP 后暂定放行，靠被动守卫兜底）。
    canaryModelPublicId: ""
    # canary 首事件预算：健康出口实测 0.8-2.2s；降智排队 68-125s。
    canaryCreatedTimeout: 10s

